<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="calculator"> 
        <input id="display" readonly>                                                 <!--Adds a display that is read only and cant be typed in-->
        <div id="keys">                                                               <!--Defines added keys-->
            <button onclick="appendToDisplay('+')" class="operator-btn">+</button>    <!--Displays defined character-->
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="operator-btn">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('/')" class="operator-btn">/</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')" >.</button>
            <button onclick="calculate()">=</button>                                   <!--Calculates the given input-->
            <button onclick="clearDisplay()" class="operator-btn">C</button>           <!--Clears the display-->
        </div>

    </div>

    <script src="index.js"></script>                                                   <!--Uses the code from given file-->
</body>
</html>
